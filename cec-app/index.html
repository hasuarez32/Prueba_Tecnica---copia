<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Panel operativo del Centro de Educación Continuada de la Universidad del Norte: cronogramas, control de tabulación de asistencia y riesgo académico." />
    <meta name="theme-color" content="#F7F4EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080F24" media="(prefers-color-scheme: dark)" />
    <title>CEC · Operación</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E1B3A'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3Ccircle cx='27' cy='27' r='4.5' fill='%23FF3D8B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo claro→oscuro.
      (function () {
        try {
          var t = localStorage.getItem('cec:tema')
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
          if (t === 'oscuro') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
